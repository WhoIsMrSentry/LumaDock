    450,

    2500,

  SPOTIFY_COLLAPSE_DELAY:
    240,

// ============================================================
// HELPERS
// ============================================================

function clamp(
  value,
  min = 0,
  max = 1
) {
  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}


function lerp(
  a,
  b,
  t
) {
  return (
    a +
    (
      b -
      a
    ) *
    t
  );
}


function smooth(
  value
) {
  const t =
    clamp(
      value
    );


  return (
    t *
    t *
    (
      3 -
      2 *
      t
    )
  );
}


function range(
  value,
  start,
  end
) {
  return smooth(
    clamp(
      (
        value -
        start
      ) /
      (
        end -
        start
      )
    )
  );
}


function inside(
  x,
  y,
  bounds
) {
  if (!bounds) {
    return false;
  }


  return (
    x >=
      bounds.x &&
    x <=
      bounds.x +
      bounds.width &&
    y >=
      bounds.y &&
    y <=
      bounds.y +
      bounds.height
  );
}


function bodyScale(
  diameter
) {
  return (
    diameter /
    82
  );
}

function resize() {
  const dpr =
    Math.min(
      devicePixelRatio ||
      1,
      2
    );


  canvas.width =
    Math.round(
      innerWidth *
      dpr
    );


  canvas.height =
    Math.round(
      innerHeight *
      dpr
    );


  canvas.style.width =
    innerWidth +
    'px';


  canvas.style.height =
    innerHeight +
    'px';


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

  'resize',
  resize
);

// ============================================================
// CHARACTER
// ============================================================

let ghostLookY =

  0;


let dizzy =
  0;

let dizzyUntil =
  0;

  0;

// ============================================================
// AUDIO
// ============================================================

let audioContext =
  null;


function getAudio() {
  if (
    !soundEnabled
  ) {
    return null;
  }


  if (
    !audioContext
  ) {
    audioContext =
      new AudioContext();
  }


  return audioContext;
}


function tone(
  from,
  to,
  duration,
  volume = 0.018,
  delay = 0
) {
  const audio =
    getAudio();


  if (!audio) {
    return;
  }


  try {
    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    const start =
      audio.currentTime +
      delay;


    oscillator.type =
      'sine';


    oscillator.frequency
      .setValueAtTime(
        from,
        start
      );


    oscillator.frequency
      .exponentialRampToValueAtTime(
        Math.max(
          20,
          to
        ),
        start +
        duration
      );


    gain.gain
      .setValueAtTime(
        0.0001,
        start
      );


    gain.gain
      .linearRampToValueAtTime(
        volume,
        start +
        0.01
      );


    gain.gain
      .exponentialRampToValueAtTime(
        0.0001,
        start +
        duration
      );


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.start(
      start
    );


    oscillator.stop(
      start +
      duration +
      0.02
    );

  } catch {}
}


function sound(
  name
) {
  if (
    !soundEnabled
  ) {
    return;
  }


  if (
    name ===
    'intro'
  ) {
    tone(
      340,
      540,
      0.12,
      0.022
    );


    tone(
      540,
      740,
      0.16,
      0.018,
      0.10
    );
  }


  if (
    name ===
    'peek'
  ) {
    tone(
      350,
      520,
      0.07,
      0.011
    );
  }


  if (
    name ===
    'open'
  ) {
    tone(
      310,
      570,
      0.12,
      0.017
    );
  }


  if (
    name ===
    'close'
  ) {
    tone(
      510,
      290,
      0.11,
      0.015
    );
  }


  if (
    name ===
    'click'
  ) {
    tone(
      630,
      430,
      0.055,
      0.015
    );
  }


  if (
    name ===
    'angry'
  ) {
    tone(
      160,
      95,
      0.17,
      0.025
    );
  }


  if (
    name ===
    'dizzy'
  ) {
    tone(
      430,
      760,
      0.19,
      0.021
    );
  }
}


// ============================================================
// TRANSITIONS
// ============================================================

function targetHeight() {
  if (
    currentView ===
    'home'
  ) {
    return UI.HOME_H;
  }


  if (
    currentView ===
    'spotify'
  ) {
    return UI.SPOTIFY_H;
  }


  if (
    currentView ===
    'apps'
  ) {
    return UI.APPS_H;
  }


  if (
    currentView ===
    'settings'
  ) {
    return UI.SETTINGS_H;
  }


  if (
    currentView ===
    'project'
  ) {
    return UI.PROJECT_H;
  }


  return UI.PROMPT_H;
}


function modeTarget(
  targetMode
) {
  if (
    targetMode ===
    'rest'
  ) {
    return {
      width:
        UI.REST_W,

      height:
        UI.BAR_H,

      radius:
        UI.COMPACT_RADIUS
    };
  }


  if (
    targetMode ===
    'compact'
  ) {
    return {
      width:
        UI.COMPACT_W,

      height:
        UI.COMPACT_H,

      radius:
        UI.COMPACT_H / 2
    };
  }


  return {
    width:
      UI.EXPANDED_W,

    height:
      targetHeight(),

    radius:
      UI.EXPANDED_RADIUS
  };
}


function setMode(
  next,
  playSound = true
) {
  const target =
    modeTarget(
      next
    );


  const same =
    mode ===
      next &&
    Math.abs(
      visual.width -
      target.width
    ) <
      1 &&
    Math.abs(
      visual.height -
      target.height
    ) <
      1;


  if (
    same &&
    !transition
  ) {
    return;
  }


  const growing =
    target.width *
    target.height >
    visual.width *
    visual.height;


  transition = {
    from: {
      ...visual
    },

    to:
      target,

    started:
      performance.now(),

    // Opening and closing use the same speed and the same motion.
    duration:
      380,

    growing
  };


  mode =
    next;


  if (
    playSound
  ) {
    sound(
      growing
        ?
          'open'
        :
          'close'
    );
  }
}


function updateTransition(
  now
) {
  if (
    !transition
  ) {
    return;
  }


  const raw =
    clamp(
      (
        now -
        transition.started
      ) /
      transition.duration
    );


  const amount =
    1 -
    Math.pow(
      1 -
      raw,
      3
    );


  // The shape moves like a spring (Apple's Dynamic Island): it overshoots a few percent and settles.
  // The corners just ease, so the shape never looks bent.
  const springy = transition.ease === 'in' ? raw * raw * raw // the blob squish: slow start, quick end
    : transition.bounce ? 1 - Math.exp(-4.6 * raw) * Math.cos(12.5 * raw) // the blob opening: a real bounce
    : 1 - Math.exp(-7 * raw) * Math.cos(7.2 * raw);


  visual.width =
    lerp(
      transition.from.width,
      transition.to.width,
      springy
    );


  visual.height =
    lerp(
      transition.from.height,
      transition.to.height,
      springy
    );


  visual.radius =
    lerp(
      transition.from.radius,
      transition.to.radius,
      amount
    );


  if (
    raw >=
    1
  ) {
    visual = {
      ...transition.to
    };


    transition =
      null;
  }
}


// ============================================================
// DRAW HELPERS
// ============================================================

function islandPath(
  x,
  y,
  width,
  height,
  radius
) {
  ctx.beginPath();


  ctx.moveTo(
    x,
    y
  );


  ctx.lineTo(
    x +
    width,
    y
  );


  ctx.lineTo(
    x +
    width,
    y +
    height -
    radius
  );


  ctx.quadraticCurveTo(
    x +
    width,
    y +
    height,

    x +
    width -
    radius,
    y +
    height
  );


  ctx.lineTo(
    x +
    radius,
    y +
    height
  );


  ctx.quadraticCurveTo(
    x,
    y +
    height,

    x,
    y +
    height -
    radius
  );


  ctx.closePath();
}


function box(
  x,
  y,
  width,
  height,
  radius,
  fill
) {
  width = Math.max(0, width || 0); height = Math.max(0, height || 0);
  radius = Math.max(0, Math.min(radius || 0, width / 2, height / 2)); // never negative
  ctx.beginPath();


  ctx.roundRect(
    x,
    y,
    width,
    height,
    Math.min(
      radius,
      width /
      2,
      height /
      2
    )
  );


  ctx.fillStyle =
    fill;


  ctx.fill();
}


function text(
  value,
  x,
  y,
  size = 12,
  color = '#fff',
  weight = 400,
  align = 'left',
  maxWidth = null
) {
  // Windows 11 font for a sharp, modern look.
  ctx.font =
    `${weight} ${size}px "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif`;


  ctx.fillStyle =
    color;


  ctx.textAlign =
    align;


  ctx.textBaseline =
    'alphabetic';


  let content =
    String(
      value ||
      ''
    );


  if (
    maxWidth &&
    align ===
    'left'
  ) {
    while (
      content.length >
        1 &&
      ctx.measureText(
        content
      ).width >
        maxWidth
    ) {
      content =
        content.slice(
          0,
          -2
        ) +
        '…';
    }
  }


  ctx.fillText(
    content,
    x,
    y
  );
}


function codeText(
  value,
  x,
  y,
  size = 9,
  color = '#d5ddd2',
  maxWidth = null
) {
  ctx.font =
    `${size}px Consolas, monospace`;


  ctx.fillStyle =
    color;


  ctx.textAlign =
    'left';


  ctx.textBaseline =
    'alphabetic';


  let content =
    String(
      value ??
      ''
    )
      .replace(
        /\t/g,
        '  '
      );


  if (
    maxWidth
  ) {
    while (
      content.length >
        1 &&
      ctx.measureText(
        content
      ).width >
        maxWidth
    ) {
      content =
        content.slice(
          0,
          -2
        ) +
        '…';
    }
  }


  ctx.fillText(
    content,
    x,
    y
  );
}


// ============================================================
// SPEAKER
// ============================================================

function drawSpeakerIcon(
  x,
  y,
  muted = false
) {
  ctx.save();


  ctx.strokeStyle =
    '#d8e2d4';


  ctx.fillStyle =
    '#d8e2d4';


  ctx.lineWidth =
    1.5;


  ctx.lineCap =
    'round';


  ctx.lineJoin =
    'round';


  ctx.beginPath();


  ctx.moveTo(
    x -
    8,
    y -
    3
  );


  ctx.lineTo(
    x -
    4,
    y -
    3
  );


  ctx.lineTo(
    x +
    1,
    y -
    7
  );


  ctx.lineTo(
    x +
    1,
    y +
    7
  );


  ctx.lineTo(
    x -
    4,
    y +
    3
  );


  ctx.lineTo(
    x -
    8,
    y +
    3
  );


  ctx.closePath();


  ctx.fill();


  if (
    muted
  ) {
    ctx.beginPath();


    ctx.moveTo(
      x +
      5,
      y -
      5
    );


    ctx.lineTo(
      x +
      11,
      y +
      5
    );


    ctx.moveTo(
      x +
      11,
      y -
      5
    );


    ctx.lineTo(
      x +
      5,
      y +
      5
    );


    ctx.stroke();

  } else {
    ctx.beginPath();


    ctx.arc(
      x +
      1,
      y,
      5,
      -0.75,
      0.75
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
      x +
      1,
      y,
      9,
      -0.72,
      0.72
    );


    ctx.stroke();
  }


  ctx.restore();
}


// ============================================================
// GHOST
// ============================================================

function drawGhost(
  x,
  y,
  diameter
) {
  // Robo is out of the island (buddy-ui.js): there is only one Robo
  if (window.__lumadockCarried?.() && !window.__lumadockBuddyDrawing) return;

  const scale =
    bodyScale(
      diameter
    );


  /*
    Kleur van het lijfje: te kiezen in
    Instellingen (lumadock-fun.js).
  */

  const look =
    window.__lumadockLook?.() ||
    {};


  const shell1 =
    angry >
      0.05
      ?
        '#795151'
      :
        look.shell1 ||
        '#59695d';


  const shell2 =
    angry >
      0.05
      ?
        '#462929'
      :
        look.shell2 ||
        '#344239';


  /*
    De ogen zijn het stoplicht (ai-monitor-ui.js):
    oranje knippert = bezig, oranje = vraag,
    groen = klaar, rood = fout.
  */

  const status =
    window.__lumadockEyes?.();


  const eye =
    angry >
      0.05
      ?
        '#ff6b6b'
      :
        status?.color ||
        look.eye ||
        '#e3ffd4';


  const eyeAlpha =
    status?.blink
      ?
        0.3 +
        0.7 *
        (
          0.5 +
          0.5 *
          Math.cos(
            performance.now() /
            200
          )
        )
      :
        1;


  ctx.save();


  ctx.translate(
    x,
    y
  );


  ctx.rotate(
    Math.sin(
      performance.now() *
      0.006
    ) *
    0.08 *
    dizzy
  );


  ctx.scale(
    scale,
    scale
  );


  /*
    lumadock-fun.js: springen, dansen,
    gezichtjes en outfits.
  */

  const fx =
    window.__lumadockGhostFx?.() ||
    {};


  ctx.translate(
    0,
    fx.dy || 0
  );


  // sx / sy: squash and stretch (wider + lower, or thinner + taller), like a jelly blob.
  ctx.scale(
    (fx.scale ?? 1) * (fx.sx ?? 1), // ?? not ||: a scale of 0 must really make him invisible
    (fx.scale ?? 1) * (fx.sy ?? 1)
  );


  ctx.rotate(
    fx.tilt || 0
  );


  // "Wolk" look: a bright white, soft rounded blob with dark eyes (the eyes take the traffic-light colour),
  // and a small status dot. Pops on the black island.
  if (look.style === 'blob') {
    drawBlob(look, status, eye, eyeAlpha, fx);
    window.__lumadockGhostDecor?.(ctx);
    ctx.restore();
    return;
  }


  ctx.beginPath();


  ctx.moveTo(
    -8,
    -28
  );


  ctx.quadraticCurveTo(
    0,
    -42,
    8,
    -28
  );


  ctx.lineTo(
    13,
    -13
  );


  ctx.fillStyle =
    shell2;


  ctx.fill();


  const gradient =
    ctx.createRadialGradient(
      -13,
      -10,
      3,
      0,
      0,
      43
    );


  gradient.addColorStop(
    0,
    shell1
  );


  gradient.addColorStop(
    1,
    '#101511'
  );


  ctx.beginPath();


  ctx.ellipse(
    0,
    0,
    41,
    32,
    0,
    0,
    Math.PI *
    2
  );


  ctx.fillStyle =
    gradient;


  ctx.fill();


  ctx.beginPath();


  ctx.ellipse(
    0,
    3,
    28,
    22,
    0,
    0,
    Math.PI *
    2
  );


  ctx.fillStyle =
    '#030504';


  ctx.fill();


  for (
    const side of [
      -1,
      1
    ]
  ) {
    ctx.save();


    ctx.translate(
      side *
      15 +
      ghostLookX,

      3 +
      ghostLookY
    );


    ctx.globalAlpha *=
      eyeAlpha;


    ctx.shadowColor =
      eye;


    ctx.shadowBlur =
      status
        ? 14
        : 9;


    drawEye(
      side,
      eye,
      angry > 0.05
        ? 'angry'
        : fx.mood
    );


    ctx.restore();
  }


  window.__lumadockGhostDecor?.(
    ctx
  );


  ctx.restore();
}


// LumaDock Cyber-Bot (Grokbot / esplink-mcp-robot inspired): futuristic rounded-squircle chassis,
// side cyber ear-transceivers, glowing energy core antenna, and deep OLED visor with expressive eyes.
function drawBlob(look, status, eye, eyeAlpha, fx) {
  const isAngry = angry > 0.05 || fx.mood === 'angry';
  const tint = isAngry ? '#ff9aa2' : look.shell2 || '#b8cce4';
  const topShell = isAngry ? '#ffe5e8' : look.shell1 || '#f2f7ff';
  const accent = status?.color || eye || '#00e5ff';

  // Ground shadow
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath();
  ctx.ellipse(0, 33, 30, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Cyber antenna with glowing status core
  const bulb = status?.color || eye || '#00e5ff';
  const bulbAlpha = status?.blink ? 0.55 + 0.45 * Math.cos(performance.now() / 190) : 1;
  const wearing = !!window.__lumadockOutfitOn?.();
  const top = wearing ? -56 : -40;
  ctx.save();
  ctx.strokeStyle = tint;
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -26);
  ctx.lineTo(0, top);
  ctx.stroke();
  // Antenna base collar
  ctx.fillStyle = tint;
  ctx.beginPath();
  ctx.roundRect(-5, -29, 10, 4, 2);
  ctx.fill();
  // Glowing orb
  ctx.globalAlpha = bulbAlpha;
  ctx.beginPath();
  ctx.arc(0, top - 3.5, 5.2, 0, Math.PI * 2);
  ctx.fillStyle = bulb;
  ctx.shadowColor = bulb;
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-1.5, top - 5, 1.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Side cyber ear-pods with neon LED strips
  ctx.save();
  for (const side of [-1, 1]) {
    ctx.fillStyle = tint;
    ctx.beginPath();
    ctx.roundRect(side * 37 - 4.5, -7, 9, 18, 4.5);
    ctx.fill();
    ctx.fillStyle = accent;
    ctx.shadowColor = accent;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.roundRect(side * 39 - 1.3, -3, 2.6, 10, 1.3);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  // Futuristic rounded-squircle head chassis
  const body = ctx.createLinearGradient(0, -28, 0, 30);
  body.addColorStop(0, topShell);
  body.addColorStop(1, tint);
  ctx.save();
  ctx.shadowColor = status?.color || 'rgba(0, 229, 255, .22)';
  ctx.shadowBlur = status?.color ? 15 : 10;
  ctx.beginPath();
  ctx.roundRect(-36, -26, 72, 56, 23);
  ctx.fillStyle = body;
  ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = 'rgba(10, 18, 32, .45)';
  ctx.stroke();
  ctx.restore();

  // Top chassis specular highlight
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-18, -22);
  ctx.lineTo(18, -22);
  ctx.stroke();
  ctx.restore();

  // Deep curved OLED visor screen
  const visor = ctx.createLinearGradient(0, -16, 0, 20);
  visor.addColorStop(0, '#060b16');
  visor.addColorStop(1, '#101c30');
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(-29, -15, 58, 35, 14);
  ctx.fillStyle = visor;
  ctx.fill();
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = 'rgba(110, 210, 255, .22)';
  ctx.stroke();
  // Subtle glass reflection on visor
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#a8ecff';
  ctx.beginPath();
  ctx.roundRect(-22, -12, 24, 3.2, 1.6);
  ctx.fill();
  ctx.restore();

  // Glowing OLED visor eyes (esplink-mcp-robot procedural animations)
  const activeMood = isAngry ? 'angry' : fx.mood;
  const animT = performance.now();
  let scanX = 0, scanY = 0;
  if (activeMood === 'focus') scanX = Math.sin(animT / 200) * 4.2;
  else if (activeMood === 'curious') { scanX = Math.sin(animT / 280) * 2.8; scanY = Math.cos(animT / 560) * 1.1; }
  else if (activeMood === 'sad') { scanY = 2.2 + Math.sin(animT / 420) * 0.8; scanX = Math.sin(animT / 60) * 0.45; }
  else if (activeMood === 'angry') { scanX = Math.sin(animT / 28) * 1.1; scanY = Math.cos(animT / 35) * 0.7; }
  else if (activeMood === 'happy') { scanY = Math.sin(animT / 115) * 1.7; }
  else if (activeMood === 'dizzy') { scanX = Math.cos(animT / 150) * 1.8; scanY = Math.sin(animT / 150) * 1.8; }

  // Visor-wide HUD effects for specific esplink-mcp-robot moods
  if (activeMood === 'focus') {
    ctx.save();
    const laserY = -9 + ((Math.sin(animT / 240) + 1) * 0.5) * 22;
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.38)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-24, laserY);
    ctx.lineTo(24, laserY);
    ctx.stroke();
    ctx.restore();
  }

  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * 12.5 + ghostLookX * 0.85 + scanX, 2.5 + ghostLookY * 0.85 + scanY);
    ctx.scale(0.86, 0.86);
    ctx.globalAlpha *= eyeAlpha;
    ctx.shadowColor = isAngry || activeMood === 'angry' ? '#ff3b5c' : activeMood === 'heart' ? '#ff4d88' : eye;
    ctx.shadowBlur = status ? 15 : 12;
    drawEye(side, isAngry || activeMood === 'angry' ? '#ff3b5c' : eye, activeMood, animT);
    ctx.restore();
  }
}

function drawVisorGlint(x = -3.6, y = -5.4, size = 3.2) {
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.beginPath();
  ctx.roundRect(x, y, size, size, 1);
  ctx.fill();
  ctx.restore();
}

function drawSparkleStar(cx, cy, r) {
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.quadraticCurveTo(cx, cy, cx + r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy + r);
  ctx.quadraticCurveTo(cx, cy, cx - r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy - r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawEye(side, eye, mood, t = performance.now()) {
  ctx.fillStyle = eye;
  ctx.strokeStyle = eye;
  ctx.lineWidth = 3.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();

  if (mood === 'happy') {
    // Upward glowing OLED crescent arc (^ ^) with bounce + digital blush
    const pulse = 1 + Math.sin(t / 115) * 0.08;
    ctx.save();
    ctx.scale(pulse, pulse);
    ctx.lineWidth = 4.0;
    ctx.arc(0, 4.2, 6.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    // Glowing digital cheek pixel
    ctx.shadowColor = '#ff6b9d';
    ctx.fillStyle = 'rgba(255, 107, 157, 0.72)';
    ctx.beginPath();
    ctx.roundRect(side * 3.8 - 2.6, 5.8, 5.2, 2.4, 1.2);
    ctx.fill();
    ctx.restore();
    return;
  }

  if (mood === 'heart') {
    // Double-beat pulsing heart eyes
    const beat = 1 + 0.19 * Math.pow(Math.sin(t / 155), 4);
    ctx.save();
    ctx.scale(beat, beat);
    ctx.moveTo(0, 6.8);
    ctx.bezierCurveTo(-10, -1, -5.8, -10, 0, -4.4);
    ctx.bezierCurveTo(5.8, -10, 10, -1, 0, 6.8);
    ctx.fillStyle = '#ff4d88';
    ctx.shadowColor = '#ff4d88';
    ctx.fill();
    drawSparkleStar(-2.2, -2.5, 2.3);
    ctx.restore();
    return;
  }

  if (mood === 'dizzy') {
    // Fast counter-spinning cyber-spiral eyes
    const turn = (t / 95) * side;
    for (let a = 0; a < Math.PI * 4.4; a += 0.25) {
      const r = a * 0.57;
      ctx.lineTo(Math.cos(a + turn) * r, Math.sin(a + turn) * r);
    }
    ctx.lineWidth = 2.4;
    ctx.stroke();
    return;
  }

  if (mood === 'wink') {
    if (side === 1) {
      // Animated cyber chevron wink (> -)
      const sq = 1 + Math.sin(t / 120) * 0.12;
      ctx.save();
      ctx.scale(sq, 1 / sq);
      ctx.lineWidth = 3.6;
      ctx.moveTo(-5.8, -3.8);
      ctx.lineTo(4.8, 0.4);
      ctx.lineTo(-5.8, 4.6);
      ctx.stroke();
      ctx.restore();
      return;
    }
    const bounce = Math.sin(t / 140) * 0.8;
    ctx.roundRect(-6.5, -8 + bounce, 13, 16, 3.8);
    ctx.fill();
    drawSparkleStar(-2.4, -3.4 + bounce, 2.8 + Math.sin(t / 110) * 0.6);
    return;
  }

  if (mood === 'cool') {
    // Sleek cyber visor shades with animated holographic light sweep
    ctx.roundRect(-8.4, -5.6, 16.8, 11.2, 2.8);
    ctx.fill();
    ctx.save();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.roundRect(-8.4, -5.6, 16.8, 11.2, 2.8);
    ctx.clip();
    const sweep = ((t / 13) % 30) - 15;
    ctx.strokeStyle = 'rgba(255,255,255,0.88)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(sweep - 5, 6);
    ctx.lineTo(sweep + 5, -6);
    ctx.stroke();
    ctx.restore();
    return;
  }

  if (mood === 'sleep' || mood === 'blink') {
    // Breathing horizontal OLED standby slit (- -)
    const w = mood === 'sleep' ? 6.5 * (0.85 + 0.15 * Math.sin(t / 450)) : 6.5;
    ctx.roundRect(-w, -1.7, w * 2, 3.4, 1.7);
    ctx.fill();
    return;
  }

  if (mood === 'focus') {
    // Esplink-mcp-robot scanning squint with moving target reticle glint
    const squint = 4.0 + Math.sin(t / 180) * 0.6;
    ctx.roundRect(-7.2, -squint, 14.4, squint * 2, 2.4);
    ctx.fill();
    drawVisorGlint(-2.5 + Math.sin(t / 200) * 2.2, -2.0, 2.6);
    return;
  }

  if (mood === 'angry') {
    // Esplink-mcp-robot sharp inner-down crimson glare with pulsing brow
    const furrow = Math.sin(t / 90) * 0.9;
    ctx.moveTo(-6.8, side === -1 ? -7.8 : -1.8 + furrow);
    ctx.lineTo(6.8, side === -1 ? -1.8 + furrow : -7.8);
    ctx.lineTo(6.8, 5.8);
    ctx.quadraticCurveTo(6.8, 7.8, 4.2, 7.8);
    ctx.lineTo(-4.2, 7.8);
    ctx.quadraticCurveTo(-6.8, 7.8, -6.8, 5.8);
    ctx.closePath();
    ctx.fill();
    drawVisorGlint(-2.8, -1.2, 2.4);
    return;
  }

  if (mood === 'sad') {
    // Esplink-mcp-robot outer-down drooping brow carve + animated falling OLED tear drop
    const droop = Math.sin(t / 240) * 0.7;
    ctx.moveTo(-6.5, side === -1 ? -1.8 + droop : -7.2);
    ctx.lineTo(6.5, side === -1 ? -7.2 : -1.8 + droop);
    ctx.lineTo(6.5, 5.8);
    ctx.quadraticCurveTo(6.5, 8, 4, 8);
    ctx.lineTo(-4, 8);
    ctx.quadraticCurveTo(-6.5, 8, -6.5, 5.8);
    ctx.closePath();
    ctx.fill();
    drawVisorGlint(-3.2, -0.8, 2.4);
    // Falling cyan digital tear drop on the outer corner
    const tearPhase = ((t / 680) + (side === 1 ? 0.5 : 0)) % 1;
    ctx.save();
    ctx.fillStyle = '#38f8ff';
    ctx.shadowColor = '#38f8ff';
    ctx.globalAlpha = 1 - tearPhase * 0.75;
    ctx.beginPath();
    ctx.arc(side * 5.2, 6.5 + tearPhase * 6.5, 1.8 * (1 - tearPhase * 0.3), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  if (mood === 'surprised') {
    // Elastic wide-eye shock pulse with twinkling 4-point star sparkle
    const shock = 1 + Math.sin(t / 85) * 0.09;
    ctx.save();
    ctx.scale(shock, shock);
    ctx.roundRect(-7.4, -9.6, 14.8, 19.2, 5.0);
    ctx.fill();
    drawSparkleStar(-2.6, -3.8, 3.2 + Math.sin(t / 70) * 0.9);
    drawVisorGlint(2.2, 2.8, 2.0);
    ctx.restore();
    return;
  }

  if (mood === 'curious') {
    // Esplink-mcp-robot asymmetric inquisitive look with dynamic eyebrow tilt
    const ask = Math.sin(t / 190) * 1.1;
    if (side === -1) {
      ctx.roundRect(-7.0, -9.4 - ask * 0.5, 14.0, 18.8 + ask, 4.4);
      ctx.fill();
      drawSparkleStar(-2.5, -4.0, 3.0 + ask * 0.3);
    } else {
      ctx.moveTo(-6.5, -2.6 + ask * 0.6);
      ctx.lineTo(6.5, -6.8 - ask * 0.4);
      ctx.lineTo(6.5, 5.8);
      ctx.quadraticCurveTo(6.5, 7.4, 4.5, 7.4);
      ctx.lineTo(-4.5, 7.4);
      ctx.quadraticCurveTo(-6.5, 7.4, -6.5, 5.8);
      ctx.closePath();
      ctx.fill();
      drawVisorGlint(-3.0, -1.5, 2.5);
    }
    return;
  }

  // Default / neutral OLED rounded-rectangle visor eye
  ctx.roundRect(-6.5, -8, 13, 16, 3.8);
  ctx.fill();
  drawVisorGlint();
}

function drawIsland() {
  const centerX =
    innerWidth /
    2;


  const x =

  islandBounds = {
    x,

    y:
      0,

      visual.width,

      visual.height
  };


  // Soft glow in Claude's colour around the island (like light from the stoplight eyes).
  const glow =
    window.__lumadockEyes?.()?.color;


  ctx.save();


  ctx.shadowColor =
    glow
      ? glow + '55'
      : 'rgba(0,0,0,.42)';


  ctx.shadowBlur =
    glow
      ? 22
      : 16;


  ctx.shadowOffsetY =
    glow
      ? 2
      : 4;


  islandPath(
    x,
    0,
    visual.width,
    visual.height,
    visual.radius
  );


  ctx.fillStyle =
    '#000';


  ctx.fill();


  ctx.restore();


  // Subtle top-lit edge: brighter at the bottom rim, like glass.
  islandPath(
    x,
    0,
    visual.width,
    visual.height,
    visual.radius
  );


  const edge =

      0,

  edge.addColorStop(

    glow
      ? glow + '40'
      : 'rgba(255,255,255,.10)'
  );


  ctx.strokeStyle =
    edge;


  ctx.lineWidth =
    1;


  ctx.stroke();
}

// ============================================================
// PROJECT LOAD
// ============================================================

async function loadProject() {
  projectLoading =
    true;


  projectError =
    '';


  try {
    const result =
      await window.lumadock
        .projectGet();


    projectState =
      result ||
      {
        ok:
          false,

        selected:
          false
      };


    if (
      !projectState.ok
    ) {
      projectError =
        projectState.error ||
        'Project kon niet geladen worden.';
    }

  } catch {
    projectError =
      'Project kon niet geladen worden.';
  }


  projectLoading =
    false;
}


async function chooseProject() {
  projectLoading =
    true;


  projectError =
    '';


  projectSearchResults =
    [];


  projectReadData =
    null;


  try {
    const result =
      await window.lumadock
        .projectChoose();


    if (
      result?.cancelled
    ) {
      projectLoading =
        false;

      return;
    }


    projectState =
      result;


    if (
      !result?.ok
    ) {
      projectError =
        result?.error ||
        'Project kon niet geopend worden.';
    }

  } catch {
    projectError =
      'Project kon niet geopend worden.';
  }


  projectLoading =
    false;
}


async function rescanProject() {
  projectLoading =
    true;


  projectError =
    '';


  try {
    const result =
      await window.lumadock
        .projectRescan();


    projectState =
      result;


    if (
      !result?.ok
    ) {
      projectError =
        result?.error ||
        'Project kon niet opnieuw gescand worden.';
    }

  } catch {
    projectError =
      'Project kon niet opnieuw gescand worden.';
  }


  projectLoading =
    false;
}


// ============================================================
// PROJECT SEARCH
// ============================================================

async function performProjectSearch() {
  const query =
    projectInput.value
      .trim();


  if (
    !query
  ) {
    projectSearchError =
      'Typ eerst wat je wilt zoeken.';

    return;
  }


  projectSearchLoading =
    true;


  projectSearchError =
    '';


  projectSearchResults =
    [];


  projectReadData =
    null;


  projectSelectedResult =
    null;


  try {
    const result =
      await window.lumadock
        .projectSearch(
          query
        );


    if (
      !result?.ok
    ) {
      projectSearchError =
        result?.error ||
        'Zoeken mislukt.';

    } else {
      projectSearchResults =
        result.results ||
        [];


      projectSearchMeta =
        result;


      if (
        projectSearchResults.length ===
        0
      ) {
        projectSearchError =
          'Ik vond hier nog geen relevante code voor.';
      }
    }

  } catch {
    projectSearchError =
      'Zoeken in het project is mislukt.';
  }


  projectSearchLoading =
    false;
}

  projectReadLoading =
    false;
}

function setAlbum(
  url
) {
  if (
    url ===
    albumUrl
  ) {
    return;
  }


  albumUrl =
    url;


  if (!url) {
    albumImage =
      null;

    return;
  }


  const image =
    new Image();


  image.onload =
    () => {
      albumImage =
        image;
    };


  image.src =
    url;
}


async function refreshSpotify() {
  if (window.__lumadockLicense?.().locked.includes('spotify')) return; // the Music pack (license-main.cjs)
  try {
    const result =
      await window.lumadock
        .spotifyGetState();


    if (!result) {
      return;
    }


    spotifyConnected =
      Boolean(
        result.connected
      );


    if (
      result.connected
    ) {
      spotifyState = {
        active:
          Boolean(
            result.active
          ),

        is_playing:
          Boolean(
            result.is_playing
          ),

        progress_ms:
          Number(
            result.progress_ms ||
            0
          ),

        duration_ms:
          Number(
            result.duration_ms ||
            0
          ),

        track:
          result.track ||
          null,

        // where it plays (this PC, your phone, the car…)
        device:
          result.device ||
          null
      };


      spotifySyncAt =
        performance.now();


      setAlbum(
        result.track
          ?.image_url ||
        ''
      );
    }

  } catch {}
}

// ============================================================
// HOVER
// ============================================================

function updateHover(
  now
) {
  if (
    !introFinished
  ) {
    return;
  }


  if (
    currentView ===
      'project' &&
    mode !==
      'expanded'
  ) {
    return;
  }


  const over =
    pointer.known &&
    inside(
      pointer.x,
      pointer.y,
      islandBounds
    );


  if (
    mode ===
    'rest'
  ) {
    if (
      over
    ) {
      hoverStartedAt =
        now;


      // Silent: the "open" sound plays once, when it really opens.
      setMode(
        'compact',
        false
      );
    }


    return;
  }


  if (
    mode ===
    'compact'
  ) {
    if (
      over
    ) {
      if (
        hoverStartedAt ===
        null
      ) {
        hoverStartedAt =
          now;
      }


      if (
        now -
        hoverStartedAt >
        UI.NORMAL_PEEK_DELAY
      ) {
        setMode(
          'expanded'
        );


        hoverStartedAt =
          null;
      }

    } else {
      setMode(
        'rest'
      );
    }


    return;
  }


  if (
    mode ===
    'expanded'
  ) {
    /*
      Elk scherm klapt in als je er niet mee bezig bent.
      Niet terwijl je typt: dan blijft hij open.
    */

    if (
      !over &&
      !isTyping()
    ) {
      if (
        leaveStartedAt ===
        null
      ) {
        leaveStartedAt =
          now;
      }


      const delay =
        currentView ===
          'home'
          ? UI.HOME_LEAVE_DELAY
          : UI.VIEW_LEAVE_DELAY;


      if (
        now -
        leaveStartedAt >
        delay
      ) {
        collapseIdle();


        leaveStartedAt =
          null;
      }

    } else {
      leaveStartedAt =
        null;
    }
  }
}


function isTyping() {
  const element =
    document.activeElement;


  return (
    document.hasFocus() &&
    Boolean(
      element &&
      (
        element.tagName === 'INPUT' ||
        element.tagName === 'TEXTAREA' ||
        element.isContentEditable
      )
    )
  );
}


function collapseIdle() {
  /*
    Zelfde als Escape: terug naar home en klein.
    island-window-ui.js zet het scherm terug
    als je de island weer aanklikt.
  */

  if (
    currentView !==
    'home'
  ) {
    projectInput.blur();


    projectInput.style.display =
      'none';


    currentView =
      'home';
  }


  setMode(
    'rest'
  );
}

// ============================================================

function updateCharacter(
  dt
) {
  let ghostX =
    innerWidth /
    2;


  let ghostY =
    12;


  if (
    mode ===
    'expanded'
  ) {
    const content =
      contentRect();


    ghostX =
      content.x +
      45;


    ghostY =
      content.y +
      content.height /
      2;
  }


  const targetX =
    pointer.known
      ?
        Math.tanh(
          (
            pointer.x -
            ghostX
          ) /
          260
        ) *
        4
      :
        0;


  const targetY =
    pointer.known
      ?
        Math.tanh(
          (
            pointer.y -
            ghostY
          ) /
          200
        ) *
        2.8
      :
        0;


  ghostLookX +=
    (
      targetX -
      ghostLookX
    ) *
    (
      1 -
      Math.exp(
        -10 *
        dt
      )
    );


  ghostLookY +=
    (
      targetY -
      ghostLookY
    ) *
    (
      1 -
      Math.exp(
        -10 *
        dt
      )
    );
}


// ============================================================
// EXPANDED
// ============================================================

function drawExpanded(
  alpha
) {
  const content =
    contentRect();


  drawHeader(
    alpha
  );


  ctx.save();


  ctx.globalAlpha =
    alpha;


  ctx.beginPath();


  ctx.rect( content.x - 16, content.y - 10, content.width + 32, content.height + 20 ); // a little room: wiggling widgets and their badges never get cut off


  ctx.clip();


  if (
    currentView ===
    'home'
  ) {
    drawHome(
      content
    );
  }


  if (
    currentView ===
    'apps'
  ) {
    drawApps(
      content
    );
  }


  if (
    currentView ===
    'project'
  ) {
    drawProject(
      content
    );
  }


  if (
    currentView ===
    'settings'
  ) {
    drawSettings(
      content
    );
  }

  // Robo's chat (chat-ui.js): Robo himself sits bottom left, drawn on the canvas
  if (currentView === 'chat') window.__lumadockDrawChat?.(content);


  if (
    currentView ===
    'spotify'
  ) {
    drawSpotify(
      content
    );
  }


  if (
    currentView ===
    'assistant'
  ) {
    drawPrompt(
      content,
      'Assistent',
      'AI-interface komt hier.'
    );
  }


  ctx.restore();
}


// ============================================================
// PROJECT INPUT POSITION
// ============================================================

function updateProjectInput() {
  const shouldShow =
    currentView ===
      'project' &&
    mode ===
      'expanded' &&
    projectState
      ?.selected &&
    !projectLoading &&
    !projectReadData &&
    !projectReadLoading &&
    projectInputBounds &&
    visual.width >
      600 &&
    visual.height >
      220;


  if (
    !shouldShow
  ) {
    projectInput.style.display =
      'none';


    return;
  }


  projectInput.style.display =
    'block';


  projectInput.style.left =
    `${projectInputBounds.x}px`;


  projectInput.style.top =
    `${projectInputBounds.y}px`;


  projectInput.style.width =
    `${projectInputBounds.width}px`;


  projectInput.style.height =
    `${projectInputBounds.height}px`;
}


// ============================================================
// INTERACTIVE
// ============================================================

// Whether the window catches clicks (on the island) or lets them through to the apps below (Chrome, ...).
// Everything goes through here. Once a second the state is sent again anyway, so it can never get stuck
// (it used to stay "catching clicks" after Claude finished, until you hovered LumaDock).
let interactiveSentAt = 0;

function sendInteractive(
  next
) {
  // while Robo is carried the island keeps the mouse, so letting go anywhere on screen reaches us
  if (window.__lumadockDragging?.()) next = true;
  if (
    next ===
    interactiveSent &&
    performance.now() - interactiveSentAt < 1000
  ) {
    return;
  }


  interactiveSent =
    next;

  interactiveSentAt =
    performance.now();


  window.lumadock
    .setIslandInteractive(
      next
    );
}


// "Typing" only counts while a visible text field really has focus and LumaDock's window is active.
// (A text field that was removed or hidden while focused used to keep this on forever.)
function typingNow() {
  const el =
    document.activeElement;

  return Boolean(
    projectInputFocused &&
    document.hasFocus() &&
    el &&
    /^(INPUT|TEXTAREA)$/.test(el.tagName) &&
    el.offsetParent !== null
  );
}


// ============================================================
// RENDER
// ============================================================

let lastFrame =
  performance.now();


function drawIslandFrame(
  now
) {
  const dt =
    Math.min(
      (
        now -
        lastFrame
      ) /
      1000,
      0.04
    );


  lastFrame =
    now;


  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );


  hit = {};


  projectInputBounds =
    null;


  if (
    !introFinished
  ) {
    drawIntro(
      now
    );


    projectInput.style.display =
      'none';


    sendInteractive(
      false
    );


    


    return;
  }


  updateTransition(
    now
  );


  drawIsland();


  updateHover(
    now
  );


  updateCharacter(
    dt
  );


  ctx.save();


  islandPath(
    islandBounds.x,
    0,
    islandBounds.width,
    islandBounds.height,
    visual.radius
  );


  ctx.clip();


  const alpha =
    range(
      visual.width,
      360,
      600
    );


  // Small content in the small/medium island (it can be wide, e.g. with answer buttons), big content when open.
  if (
    mode !== 'expanded' ||
    visual.width <
    380
  ) {
    drawSmall();

  } else {
    drawExpanded(
      alpha
    );
  }


  ctx.restore();


  updateProjectInput();


  const overIsland =
    pointer.known &&
    inside(
      pointer.x,
      pointer.y,
      islandBounds
    );


  const overHit =
    pointer.known &&
    Object.values(
      hit
    ).some(
      bounds =>
        inside(
          pointer.x,
          pointer.y,
          bounds
        )
    );


  // Catch the mouse only while it is really on the island. Typing does not need it (keyboard focus
  // stays anyway), and catching the mouse while typing made the invisible window (860×320, over the
  // browser's tabs and address bar) eat clicks meant for Chrome until you clicked LumaDock again.
  sendInteractive(
    overIsland ||
    overHit
  );


  const cursorNow = overHit ? 'pointer' : 'default';

  if (canvas.style.cursor !== cursorNow) {
    canvas.style.cursor = cursorNow;
  }


  
}



let lumadockLastFrameError = -Infinity;
let lumadockLastDraw = -Infinity;

function render(now) {
  try {
    // Resting and the mouse is elsewhere: 30 frames a second is plenty for the small pill
    // and halves the work the PC does all day long.
    if (mode === 'rest' && !pointer.known && now - lumadockLastDraw < 30) return;
    lumadockLastDraw = now;
    drawIslandFrame(now);
  } catch (error) {
    if (now - lumadockLastFrameError >= 1000) {
      lumadockLastFrameError = now;

      console.error(
        '[LumaDock frame]',
        error.stack || error.message || String(error)
      );
    }

    try { ctx.reset?.(); } catch {} // a half-drawn frame can leave ctx.save() states behind
    try {
      resize();
    } catch {}
    // Still decide if the window catches clicks: otherwise one broken frame left the island "click-through"
    // until you hovered or clicked LumaDock again.
    try { sendInteractive(pointer.known && inside(pointer.x, pointer.y, islandBounds)); } catch {}
  } finally {
    requestAnimationFrame(render);
  }
}

requestAnimationFrame(
  render
);


// ============================================================
// LOCAL POINTER
// ============================================================

addEventListener(
  'mousemove',

  event => {
    pointer.x =
      event.clientX;


    pointer.y =
      event.clientY;


    pointer.known =
      true;
  }
);


// ============================================================
// CLICK
// ============================================================

canvas.addEventListener(
  'click',

  async event => {
    const x =
      event.clientX;


    const y =
      event.clientY;


    // ======================================================
    // PROJECT
    // ======================================================

    if (
      inside(
        x,
        y,
        hit.projectChoose
      )
    ) {
      await chooseProject();

      return;
    }


    if (
      inside(
        x,
        y,
        hit.projectSearch
      )
    ) {
      await performProjectSearch();

      return;
    }


    if (
      inside(
        x,
        y,
        hit.projectReadBack
      )
    ) {
      projectReadData =
        null;


      projectSelectedResult =
        null;


      return;
    }


    for (
      let i = 0;
      i <
      3;
      i++
    ) {
      if (
        inside(
          x,
          y,
          hit[
            `projectResult${i}`
          ]
        )
      ) {
        await openProjectResult(
          projectSearchResults[
            i
          ]
        );


        return;
      }
    }


    // ======================================================
    // SMALL ISLAND
    // ======================================================

    if (
      mode !==
        'expanded' &&
      inside(
        x,
        y,
        islandBounds
      )
    ) {
      setMode(
        'expanded'
      );


      return;
    }


    // ======================================================
    // HEADER
    // ======================================================

    if (
      inside(
        x,
        y,
        hit.home
      )
    ) {
      setView(
        'home'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.apps
      )
    ) {
      setView(
        'apps'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.settings
      )
    ) {
      setView(
        'settings'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.sound
      )
    ) {
      soundEnabled =
        !soundEnabled;


      localStorage.setItem(
        'lumadock:sound',
        soundEnabled
          ?
            'on'
          :
            'off'
      );


      return;
    }


    // ======================================================
    // APPS
    // ======================================================

    if (
      inside(
        x,
        y,
        hit.projectApp
      )
    ) {
      setView(
        'project'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.spotifyApp
      )
    ) {
      try {
        const state =
          await window.lumadock
            .spotifyGetState();


        if (
          !state?.connected
        ) {
          await window.lumadock
            .spotifyConnect();
        }


        await refreshSpotify();


        setView(
          'spotify'
        );

      } catch {}


      return;
    }


    if (
      inside(
        x,
        y,
        hit.todayApp
      )
    ) {
      window.lumadock
        .openUrl(
          'https://lumadock.app/opvolgen/'
        );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.assistantApp
      )
    ) {
      setView(
        'assistant'
      );


      return;
    }
  }
);


// ============================================================
// ESCAPE
// ============================================================

addEventListener(
  'keydown',

  event => {
    if (
      event.key !==
      'Escape'
    ) {
      return;
    }


    if (
      document.activeElement ===
      projectInput
    ) {
      projectInput.blur();

      return;
    }


    if (
      currentView ===
        'project' &&
      projectReadData
    ) {
      projectReadData =
        null;


      projectSelectedResult =
        null;


      return;
    }


    const leavingProject = currentView === 'project';

    currentView =
      'home';


    projectInput.style.display =
      'none';


    setMode(
      leavingProject ? 'compact' : 'rest'
    );
  }
);


// ============================================================
// SPOTIFY POLL
// ============================================================

setInterval(
  () => {
    if (
      currentView ===
      'spotify'
    ) {
      refreshSpotify();
    }
  },

  2200
);

</script>
