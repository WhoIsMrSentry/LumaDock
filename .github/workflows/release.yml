name: Test and Release LumaDock

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-win:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save electron-builder
      - name: Inject build-time Spotify Client ID
        shell: pwsh
        env:
          SPOTIFY_ID: ${{ secrets.LUMADOCK_SPOTIFY_CLIENT_ID }}
        run: |
          if ($env:SPOTIFY_ID) {
            @{ spotifyClientId = $env:SPOTIFY_ID.Trim() } | ConvertTo-Json | Set-Content -Encoding UTF8 src/main/build-config.json
          }
      - run: npx electron-builder --win nsis portable zip --publish never
      - name: Prepare upload directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-win | Out-Null
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Copy-Item -Destination release-win/
      - uses: actions/upload-artifact@v4
        with:
          name: win-dist
          path: release-win/*

  build-mac:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save electron-builder
      - name: Inject build-time Spotify Client ID
        shell: bash
        env:
          SPOTIFY_ID: ${{ secrets.LUMADOCK_SPOTIFY_CLIENT_ID }}
        run: |
          if [ -n "$SPOTIFY_ID" ]; then
            node -e 'require("fs").writeFileSync("src/main/build-config.json", JSON.stringify({ spotifyClientId: process.env.SPOTIFY_ID.trim() }) + "\n")'
          fi
      - name: Build macOS installers (arm64 + x64)
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Prepare upload directory
        shell: bash
        run: |
          mkdir -p release-mac
          cp dist/*.dmg dist/*.zip release-mac/
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: release-mac/*

  publish-release:
    needs: [ build-win, build-mac ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-dist
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: mac-dist
          path: release-assets
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" release-assets/* --repo "${{ github.repository }}" --title "LumaDock $TAG" --generate-notes
          fi
